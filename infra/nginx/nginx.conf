user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
	worker_connections 2048;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	server_tokens off;
	sendfile on;
	tcp_nopush on;
	keepalive_timeout 65;

	# Journaux d'accès en JSON (collectés par Docker, centralisables plus tard).
	log_format json escape=json '{'
		'"time":"$time_iso8601","remote_addr":"$remote_addr","host":"$host",'
		'"method":"$request_method","uri":"$request_uri","status":$status,'
		'"bytes":$body_bytes_sent,"request_time":$request_time,'
		'"upstream":"$upstream_addr","upstream_time":"$upstream_response_time",'
		'"referer":"$http_referer","user_agent":"$http_user_agent","request_id":"$request_id"'
	'}';
	access_log /dev/stdout json;

	# Taille maximale des requêtes : 22 Mo (uploads médias EasyAdmin = 20 Mo).
	client_max_body_size 22m;
	client_body_timeout 30s;
	client_header_timeout 15s;
	large_client_header_buffers 4 16k;

	gzip on;
	gzip_vary on;
	gzip_proxied any;
	gzip_min_length 1024;
	gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

	# --- Limites de débit (par IP) ---
	limit_req_zone $binary_remote_addr zone=general:20m rate=30r/s;
	limit_req_zone $binary_remote_addr zone=api:20m rate=15r/s;
	limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
	limit_req_zone $binary_remote_addr zone=payment:10m rate=20r/m;
	limit_conn_zone $binary_remote_addr zone=perip:10m;
	limit_req_status 429;
	limit_conn_status 429;

	# Résolution DNS Docker : un conteneur recréé (nouvelle IP) est retrouvé
	# sans redémarrer Nginx.
	resolver 127.0.0.11 valid=10s ipv6=off;

	# Schéma vu par le client : en mode « derrière Caddy », Nginx reçoit du HTTP
	# mais le client est en HTTPS (en-tête posé par Caddy).
	map $http_x_forwarded_proto $forwarded_proto {
		default $scheme;
		https https;
	}
	map $forwarded_proto $forwarded_port {
		https 443;
		default 80;
	}

	map $http_upgrade $connection_upgrade {
		default upgrade;
		'' close;
	}

	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers off;
	ssl_session_cache shared:SSL:10m;
	ssl_session_timeout 1d;
	ssl_session_tickets off;

	include /etc/nginx/conf.d/*.conf;
}

framework:
    messenger:
        failure_transport: failed

        transports:
            # Redis Streams en conteneur ; `sync://` par défaut hors Docker (voir .env).
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    delay: 5000
                    multiplier: 3
            failed: '%env(MESSENGER_FAILED_TRANSPORT_DSN)%'

        routing:
            # Les e-mails (reçus de don, billets, newsletter) partent via le worker :
            # une panne SMTP ne bloque plus la requête HTTP et l'envoi est rejoué.
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
                failed: 'in-memory://'

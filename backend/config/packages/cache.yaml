framework:
    cache:
        prefix_seed: ccapac/backend

        # Redis partagé entre l'API, le worker et le scheduler (état du scheduler,
        # rate-limiters, cache applicatif).
        app: cache.adapter.redis
        default_redis_provider: '%env(REDIS_URL)%'

when@test:
    framework:
        cache:
            app: cache.adapter.array

version: 2
updates:
  - { package-ecosystem: npm,            directory: /frontend,     schedule: { interval: weekly }, open-pull-requests-limit: 5 }
  - { package-ecosystem: npm,            directory: /node-api,     schedule: { interval: weekly }, open-pull-requests-limit: 5 }
  - { package-ecosystem: composer,       directory: /backend,      schedule: { interval: weekly }, open-pull-requests-limit: 5 }
  - { package-ecosystem: docker,         directory: /backend,      schedule: { interval: weekly } }
  - { package-ecosystem: docker,         directory: /frontend,     schedule: { interval: weekly } }
  - { package-ecosystem: docker,         directory: /node-api,     schedule: { interval: weekly } }
  - { package-ecosystem: docker,         directory: /infra/nginx,  schedule: { interval: weekly } }
  - { package-ecosystem: github-actions, directory: /,             schedule: { interval: weekly } }

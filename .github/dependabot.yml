# Mises à jour hebdomadaires, regroupées par écosystème (une PR au lieu d'une
# par paquet). Les versions MAJEURES sont ignorées : elles demandent une
# migration et se font à la main, une par une. Les alertes de sécurité
# (Dependabot security updates) restent actives indépendamment.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      mineures:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: "/node-api"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      mineures:
        update-types: [minor, patch]
  - package-ecosystem: composer
    directory: "/backend"
    schedule:
      interval: weekly
      day: monday

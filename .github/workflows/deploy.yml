name: Deploy

# Chaîne : CI → images validées (GHCR) → production (pas d'environnement de staging).
# Déclenchement MANUEL uniquement (Actions → Deploy → Run workflow) tant que le
# déploiement automatique sur `main` n'est pas validé. Pour l'activer, ajouter :
#   push:
#     branches: [main]
# Validation optionnelle : « Required reviewers » sur l'environnement `production`.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  meta:
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.meta.outputs.registry }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "registry=ghcr.io/${owner}/ccapac-platform" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

  # Images applicatives (identiques quel que soit le domaine).
  images:
    needs: [ci, meta]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: backend,           context: backend,       target: prod }
          - { name: node-api,          context: node-api,      target: runner }
          - { name: nginx,             context: infra/nginx,   target: "" }
          - { name: backup,            context: infra/backup,  target: "" }
          - { name: frontend-migrator, context: frontend,      target: migrator }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ needs.meta.outputs.registry }}/${{ matrix.name }}:${{ needs.meta.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false
      - name: Scan de l'image (Trivy, CRITICAL bloquant)
        uses: aquasecurity/trivy-action@v0.35.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ needs.meta.outputs.registry }}/${{ matrix.name }}:${{ needs.meta.outputs.tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # Le frontend fige ses URLs publiques (NEXT_PUBLIC_*) au build.
  frontend-images:
    needs: [ci, meta]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - env: production
            site: ${{ vars.PRODUCTION_SITE_DOMAIN }}
            api: ${{ vars.PRODUCTION_API_DOMAIN }}
            node_api: ${{ vars.PRODUCTION_NODE_API_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          target: runner
          push: true
          tags: ${{ needs.meta.outputs.registry }}/frontend:${{ needs.meta.outputs.tag }}-${{ matrix.env }}
          build-args: |
            NEXT_PUBLIC_CONTENT_API_URL=https://${{ matrix.api }}/api/content
            NEXT_PUBLIC_API_URL=https://${{ matrix.node_api }}/api
            NEXT_PUBLIC_SITE_URL=https://${{ matrix.site }}
            NEXT_PUBLIC_URL=https://${{ matrix.site }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_PAYMENT_ENABLED=${{ vars.PAYMENT_ENABLED || 'false' }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          provenance: false
      - name: Scan de l'image (Trivy, CRITICAL bloquant)
        uses: aquasecurity/trivy-action@v0.35.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ needs.meta.outputs.registry }}/frontend:${{ needs.meta.outputs.tag }}-${{ matrix.env }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  production:
    needs: [meta, images, frontend-images]
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: production
      registry: ${{ needs.meta.outputs.registry }}
      tag: ${{ needs.meta.outputs.tag }}
    secrets: inherit

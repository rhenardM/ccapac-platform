name: _deploy (réutilisable)

# Déploie un commit sur le serveur, qui est un clone git du dépôt :
#   1. git fetch + checkout du commit exact (compose, Nginx, scripts à jour)
#   2. deploy.sh --images : pull des images GHCR construites et scannées par la CI,
#      migrations, health checks, rollback automatique en cas d'échec
#
# Le .env du serveur reste la source de vérité des secrets (rien n'est écrasé).
#
# Environnement GitHub `production` :
#   secrets   SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, SSH_KNOWN_HOSTS
#   variables DEPLOY_PATH (ex. /opt/ccapac/production), SITE_DOMAIN

on:
  workflow_call:
    inputs:
      environment: { type: string, required: true }
      registry: { type: string, required: true }
      tag: { type: string, required: true }

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: https://${{ vars.SITE_DOMAIN }}
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
      SHA: ${{ github.sha }}
    steps:
      - name: Configuration présente
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          missing=""
          [ -n "$SSH_HOST" ] || missing="$missing SSH_HOST"
          [ -n "$SSH_USER" ] || missing="$missing SSH_USER"
          [ -n "$SSH_PRIVATE_KEY" ] || missing="$missing SSH_PRIVATE_KEY"
          [ -n "$SSH_KNOWN_HOSTS" ] || missing="$missing SSH_KNOWN_HOSTS"
          [ -n "$DEPLOY_PATH" ] || missing="$missing DEPLOY_PATH(variable)"
          [ -n "$SITE_DOMAIN" ] || missing="$missing SITE_DOMAIN(variable)"
          if [ -n "$missing" ]; then
            echo "::error::Manquant dans l'environnement ${{ inputs.environment }} :$missing"
            exit 1
          fi

      - name: Clé SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          echo "SSH=ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" >> "$GITHUB_ENV"

      - name: Code du serveur sur le commit déployé
        run: |
          $SSH "set -e; cd '$DEPLOY_PATH'
            git fetch --quiet origin
            git checkout --quiet --detach '$SHA'
            echo \"serveur sur : \$(git log --oneline -1)\""

      - name: Déploiement (rollback automatique en cas d'échec)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $SSH "echo '$TOKEN' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null \
            && bash '$DEPLOY_PATH/infra/scripts/deploy.sh' --images '${{ inputs.registry }}' '${{ inputs.tag }}'; \
            status=\$?; docker logout ghcr.io >/dev/null; exit \$status"

      - name: Health check public
        run: curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "https://$SITE_DOMAIN/api/health"

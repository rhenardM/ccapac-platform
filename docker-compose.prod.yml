# Surcharge staging / production : images issues de la CI (GHCR), jamais
# construites sur le serveur, limites de ressources, redémarrage systématique.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

x-prod: &prod
  restart: always
  pull_policy: missing

services:
  nginx:      { <<: *prod, deploy: { resources: { limits: { cpus: "1.0", memory: 256M } } } }
  frontend:   { <<: *prod, deploy: { resources: { limits: { cpus: "1.5", memory: 1G } } } }
  backend:    { <<: *prod, deploy: { resources: { limits: { cpus: "1.5", memory: 768M } } } }
  worker:     { <<: *prod, deploy: { resources: { limits: { cpus: "0.5", memory: 384M } } } }
  scheduler:  { <<: *prod, deploy: { resources: { limits: { cpus: "0.5", memory: 384M } } } }
  node-api:   { <<: *prod, deploy: { resources: { limits: { cpus: "1.0", memory: 512M } } } }
  backup:     { <<: *prod, deploy: { resources: { limits: { cpus: "0.5", memory: 512M } } } }
  frontend-migrate: { pull_policy: missing }

  postgres:
    restart: always
    deploy: { resources: { limits: { cpus: "2.0", memory: 2G } } }
  redis:
    restart: always
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?}
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
    deploy: { resources: { limits: { cpus: "0.5", memory: 640M } } }
  node-db:
    restart: always
    deploy: { resources: { limits: { cpus: "1.0", memory: 1G } } }
